syntax = "proto3";

package indexer.v1;

// Service definition for the "Dumb" Search Node.
// It handles writing data (indexing) and reading data (searching).
service IndexService {
  // Pushes a batch of CDC changes to the node.
  // Using batches is critical for high throughput to reduce gRPC overhead.
  rpc IndexBatch(IndexBatchRequest) returns (IndexBatchResponse);

  // Executes a search query against the local Tantivy index.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Returns all document IDs that share the given partition key.
  // Used by the ingestor to resolve range deletes: the ingestor queries
  // for candidate document IDs, filters by clustering key range locally,
  // and then issues individual DELETE operations.
  rpc ListDocumentIdsByPartitionKey(ListDocIdsRequest) returns (ListDocIdsResponse);

  // Simple health check for the Ingestor/Gateway to know if this node is alive.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ------------------------------------------------------------
// Indexing Messages
// ------------------------------------------------------------

message IndexBatchRequest {
  repeated IndexOperation operations = 1;
}

message IndexOperation {
  // The specific operation type derived from Scylla CDC 'operation' column.
  enum OpType {
    // Default value, should not be used explicitly.
    OP_TYPE_UNSPECIFIED = 0;
    // Insert or Update (Tantivy handles both as "delete old + add new").
    OP_TYPE_UPSERT = 1;
    // Hard delete (Tombstone) targeting a single document by exact ID.
    OP_TYPE_DELETE = 2;
    // Partition delete: removes ALL documents sharing a partition key.
    // The node uses the `partition_key` field (not `id`) to locate targets.
    OP_TYPE_PARTITION_DELETE = 3;
  }

  // The unique Primary Key of the row (e.g., UUID or String).
  // Used for:
  // 1. Term deletion (to remove previous versions).
  // 2. Deduplication.
  string id = 1;

  // The operation type (Upsert, Delete, or PartitionDelete).
  OpType op_type = 2;

  // ScyllaDB 'writetime' (microseconds).
  // CRITICAL FOR CORRECTNESS:
  // The Node must compare this against the stored doc's timestamp.
  // If incoming_writetime < stored_writetime, the operation is ignored.
  uint64 writetime = 3;

  // ScyllaDB 'ttl' (seconds).
  // Used to determine if the document should be deleted after a certain time.
  optional int64 cdc_ttl = 4;

  // The actual data to index.
  // - For UPSERT: A JSON string representing the row columns.
  //   Collection columns with delta semantics are excluded from this field
  //   and instead represented in collection_deltas below.
  // - For DELETE / PARTITION_DELETE: Empty (we only need the ID to delete).
  // We use string (JSON) for flexibility so the schema can evolve
  // without changing the Proto definition.
  string payload_json = 5;

  // Delta operations for non-frozen collection columns (sets, lists, maps).
  // ScyllaDB CDC provides per-element add/remove signals rather than the
  // full collection state. These deltas let the node apply set-theoretic
  // merge (union, subtract, tombstone-and-replace) instead of wholesale
  // array replacement.
  //
  // Only populated for delta rows (RowInsert, RowUpdate).
  //
  // PostImage rows carry the full state in payload_json and leave this empty.
  repeated CollectionDelta collection_deltas = 6;

  // The partition key portion of the document ID (e.g., "user-123" for a
  // table with PRIMARY KEY (user_id, order_id)).
  //
  // - For UPSERT: indexed as a separate Tantivy field so the node can
  //   efficiently look up all documents belonging to the same partition.
  // - For PARTITION_DELETE: identifies which partition to delete.
  // - For DELETE: optional; unused by the node but may be set for consistency.
  optional string partition_key = 7;
}

// Represents a delta operation on a single non-frozen collection column.
//
// ScyllaDB CDC exposes three signals for collection mutations:
//   1. Added elements   — the column value itself (new elements to union in)
//   2. Deleted elements  — cdc$deleted_elements_<col> (specific elements to remove)
//   3. Collection tombstone — cdc$deleted_<col> (clear entire collection before adding)
//
// The node applies these in order: tombstone → remove → add.
message CollectionDelta {
  // The column name this delta applies to (e.g., "tags").
  string column = 1;

  // Whether the entire collection was tombstoned (cdc$deleted_<col> = true).
  // When true, the node clears the existing collection before applying
  // added_elements. This is the CDC signal for full-collection overwrite
  // (e.g., `UPDATE t SET tags = {'a','b'} WHERE ...`).
  bool tombstoned = 2;

  // Elements to add to the collection, as a JSON array.
  //
  // For sets/lists: `["elem1", "elem2"]`.
  //
  // For maps: a JSON object `{"key1": "val1"}`.
  //
  // Empty string means no elements to add.
  string added_elements_json = 3;

  // Elements to remove from the collection, as a JSON array.
  //
  // For sets: `["elem1", "elem2"]` (values to remove).
  //
  // For maps: `["key1", "key2"]` (keys to remove).
  //
  // Empty string means no elements to remove.
  string deleted_elements_json = 4;
}

message IndexBatchResponse {
  // Number of operations successfully processed.
  uint32 processed_count = 1;
  // Number of operations skipped (e.g., due to stale writetime).
  uint32 skipped_count = 2;
  // If the batch failed partially, details can go here.
  // For MVP, usually fail-fast or success.
  bool success = 3;
}

// ------------------------------------------------------------
// Search Messages
// ------------------------------------------------------------

message SearchRequest {
  // The raw query string (e.g., "title:apple AND description:fruit").
  // This is passed directly to Tantivy's QueryParser.
  string query = 1;

  // Max number of results to return (Top N).
  uint32 limit = 2;

  // Number of results to skip (for basic pagination).
  uint32 offset = 3;

  // Consistency level for the search query.
  // - ALL: Query must succeed on all nodes. If any node fails, the entire query fails.
  // - ANY: Query succeeds if at least one node responds. Partial results are returned.
  // Default is ANY for backward compatibility.
  enum Consistency {
    CONSISTENCY_UNSPECIFIED = 0;
    CONSISTENCY_ANY = 1;
    CONSISTENCY_ALL = 2;
  }
  Consistency consistency = 4;

  // Optional list of document sub-field names (without the "document." prefix)
  // to use as default search fields when the query string does not contain an
  // explicit field prefix.
  //
  // When non-empty, a bare query such as `wireless` is expanded by the node
  // into `(document.<f1>:wireless OR document.<f2>:wireless OR ...)` before
  // being handed to Tantivy's QueryParser. When empty, the node falls back to
  // the legacy behaviour of using the entire `document` JSON field as the
  // sole default field.
  repeated string default_fields = 5;

  // List of document sub-field names (without the "document." prefix) to
  // aggregate bucket counts over. When non-empty, the response `facets` field
  // will contain one `FacetResult` per requested field with the unique values
  // and their document counts across all matching documents.
  // Empty means no aggregation is performed (no overhead).
  repeated string facet_fields = 6;
}

// A single bucket in a facet aggregation result.
message FacetBucket {
  // The unique field value (as a string).
  string value = 1;
  // Number of matching documents that contain this value.
  uint64 count = 2;
}

// Aggregation result for a single facet field.
message FacetResult {
  // The document sub-field name (without "document." prefix) that was faceted.
  string field = 1;
  // Buckets for this field, sorted by count descending.
  repeated FacetBucket buckets = 2;
}

message SearchResponse {
  // The list of matching documents.
  repeated SearchHit hits = 1;

  // Total estimated number of documents matching the query
  // (not just the returned limit).
  uint64 total_hits = 2;

  // Duration of the search in the node (debug/monitoring).
  uint64 duration_ms = 3;

  // Facet aggregation results, one per requested `facet_fields` entry.
  // Empty when `facet_fields` was not specified in the request.
  repeated FacetResult facets = 4;
}

message SearchHit {
  // The document ID.
  string id = 1;

  // The relevance score calculated by BM25.
  float score = 2;

  // The stored document content (as JSON).
  // Gateway will aggregate these.
  string payload_json = 3;
}

// ------------------------------------------------------------
// List Document IDs Messages
// ------------------------------------------------------------

message ListDocIdsRequest {
  // The partition key value to search for.
  // Must match the `partition_key` field indexed on documents.
  string partition_key = 1;
}

message ListDocIdsResponse {
  // All document IDs that share the given partition key.
  repeated string document_ids = 1;
}

// ------------------------------------------------------------
// Health Messages
// ------------------------------------------------------------

message HealthCheckRequest {}

message HealthCheckResponse {
  bool serving = 1;
}
