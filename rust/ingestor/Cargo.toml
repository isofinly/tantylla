[package]
name = "tantylla-ingestor"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
futures = "0.3.31"
scylla = "1.3.1"
scylla-cdc = "0.4.1"
tokio = { version = "1.47.1", features = ["full", "rt-multi-thread", "macros", "sync", "time"] }

tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = "0.1"

async-stream = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tracing = "0.1.44"
base64 = "0.22.1"
hex = "0.4.3"

tantylla-common = { path = "../common" }
uuid = "1.19.0"
ahash = "0.8.12"
twox-hash = "2.1.2"

[build-dependencies]
tonic-prost-build = "0.14"
