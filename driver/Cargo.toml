[package]
name = "driver"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
resolver = "2"

[build]
target-dir = "~/.cargo-target"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
futures = "0.3.31"
scylla = "1.3.1"
scylla-cdc = "0.4.1"
tokio = { version = "1.47.1", features = ["full"] }
